# Télécharge les photos Unsplash listées dans photos/candidats.txt (le poste de travail de Claude n'a pas accès à Unsplash).
name: Photos
on:
  push:
    branches: [photos-candidats]
    paths: [photos/candidats.txt, photos/logos.txt, photos/telechargements.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          mkdir -p photos/candidats
          while read -r key id; do
            [ -z "$id" ] && continue
            f="photos/candidats/${key}--${id}.jpg"
            [ -f "$f" ] && continue
            curl -fsSL "https://images.unsplash.com/photo-${id}?w=1600&q=80&fm=jpg&fit=max" -o "$f" || echo "échec $id"
          done < photos/candidats.txt
          ls -la photos/candidats | head -100
      - name: Logos des fournisseurs
        run: python3 photos/logos.py | tee photos/logos/journal.txt
      - name: Téléchargements directs
        run: |
          while read -r f u; do
            [ -z "$u" ] && continue
            curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -H "Accept: image/avif,image/webp,image/*,*/*" -e "https://www.google.com/" "$u" -o "photos/logos/$f" && echo "ok $f" || echo "échec $f"
          done < photos/telechargements.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add photos/candidats photos/logos
          git commit -m "Photos candidates téléchargées" || exit 0
          git push
